name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package.json

      - name: Install dependencies
        run: npm install
        working-directory: app

      - name: Run tests
        run: npm test
        working-directory: app

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render Deploy
        run: curl -s -X GET "${{ secrets.RENDER_DEPLOY_HOOK }}" -w "\nHTTP Status: %{http_code}"

  notify:
    name: Notify via Telegram
    runs-on: ubuntu-latest
    needs: [test, deploy]
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Send Telegram notification
        run: |
          python3 << 'EOF'
          import urllib.request, json, os
          deploy = os.environ.get('DEPLOY_STATUS', 'unknown')
          test = os.environ.get('TEST_STATUS', 'unknown')
          emoji = "✅" if deploy == "success" else "❌"
          status = "Deployment Successful" if deploy == "success" else "Deployment Failed"
          sha = os.environ.get('SHA', '')[:7]
          msg = f"{emoji} {status}\nRepo: {os.environ.get('REPO')}\nBranch: {os.environ.get('BRANCH')}\nCommit: {sha}\nAuthor: {os.environ.get('AUTHOR')}\nTests: {test} | Deploy: {deploy}\nURL: https://devops-project-og10.onrender.com"
          data = json.dumps({"chat_id": os.environ["TELEGRAM_CHAT_ID"], "text": msg}).encode()
          req = urllib.request.Request(
            f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage",
            data=data,
            headers={"Content-Type": "application/json"}
          )
          urllib.request.urlopen(req)
          print("Telegram notification sent!")
          EOF
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPLOY_STATUS: ${{ needs.deploy.result }}
          TEST_STATUS: ${{ needs.test.result }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          SHA: ${{ github.sha }}
