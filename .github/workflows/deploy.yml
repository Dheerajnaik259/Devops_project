name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package.json

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Run tests
        working-directory: app
        run: npm test

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render Deploy
        run: |
          curl -s -X GET "$RENDER_DEPLOY_HOOK"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}

  notify:
    name: Notify via Telegram
    runs-on: ubuntu-latest
    needs: [test, deploy]
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPLOY_STATUS: ${{ needs.deploy.result }}
          TEST_STATUS: ${{ needs.test.result }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          SHA: ${{ github.sha }}
        run: |
          python3 << 'PYEOF'
          import urllib.request, json, os
          deploy = os.environ.get('DEPLOY_STATUS', 'unknown')
          test = os.environ.get('TEST_STATUS', 'unknown')
          emoji = "OK" if deploy == "success" else "FAIL"
          sha = os.environ.get('SHA', '')[:7]
          lines = [
            emoji + " Pipeline " + ("Succeeded" if deploy == "success" else "Failed"),
            "Repo: " + os.environ.get('REPO', ''),
            "Branch: " + os.environ.get('BRANCH', ''),
            "Commit: " + sha,
            "Author: " + os.environ.get('AUTHOR', ''),
            "Tests: " + test,
            "Deploy: " + deploy,
            "URL: https://devops-project-og10.onrender.com"
          ]
          msg = "\n".join(lines)
          payload = json.dumps({"chat_id": os.environ["TELEGRAM_CHAT_ID"], "text": msg}).encode()
          req = urllib.request.Request(
            "https://api.telegram.org/bot" + os.environ["TELEGRAM_BOT_TOKEN"] + "/sendMessage",
            data=payload,
            headers={"Content-Type": "application/json"}
          )
          urllib.request.urlopen(req)
          print("Notification sent!")
          PYEOF
