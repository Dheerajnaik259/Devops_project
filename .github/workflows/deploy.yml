name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  SERVICE_NAME: cicd-gcp-app

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Run Tests
  # ─────────────────────────────────────────
  test:
    name: ✅ Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package.json

      - name: Install dependencies
        run: npm install
        working-directory: app

      - name: Run tests
        run: npm test
        working-directory: app

  # ─────────────────────────────────────────
  # JOB 2: Build & Push Docker Image (only on push to main)
  # ─────────────────────────────────────────
  build-and-push:
    name: 🐳 Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    outputs:
      image: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ─────────────────────────────────────────
  # JOB 3: Deploy to GCP VM
  # ─────────────────────────────────────────
  deploy:
    name: 🚀 SSH Deploy to GCP VM
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: SSH into VM and deploy container
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          port: 22
          envs: IMAGE_NAME,GITHUB_ACTOR,GITHUB_TOKEN
          script: |
            # Convert IMAGE_NAME to lowercase
            IMAGE_LOWER=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
            
            # Log in to GHCR
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            
            # Pull the latest image
            docker pull "$IMAGE_LOWER:latest"
            
            # Stop and remove existing container if running
            docker stop ${{ env.SERVICE_NAME }} || true
            docker rm ${{ env.SERVICE_NAME }} || true
            
            # Run the new container
            docker run -d \
              --name ${{ env.SERVICE_NAME }} \
              -p 80:8080 \
              --restart always \
              -e APP_VERSION=${{ github.sha }} \
              "$IMAGE_LOWER:latest"
              
            # Clean up old unused images
            docker image prune -f

  # ─────────────────────────────────────────
  # JOB 4: Telegram Notification
  # ─────────────────────────────────────────
  notify:
    name: 📬 Notify via Telegram
    runs-on: ubuntu-latest
    needs: [test, build-and-push, deploy]
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DEPLOY_STATUS="${{ needs.deploy.result }}"
          TEST_STATUS="${{ needs.test.result }}"
          COMMIT_MSG=$(echo "${{ github.event.head_commit.message }}" | head -1)
          AUTHOR="${{ github.event.head_commit.author.name }}"
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"

          if [ "$DEPLOY_STATUS" = "success" ]; then
            EMOJI="✅"
            STATUS_TEXT="Deployment Successful"
          else
            EMOJI="❌"
            STATUS_TEXT="Deployment Failed"
          fi

          MESSAGE="${EMOJI} *${STATUS_TEXT}*

🔀 *Repo:* \`${{ github.repository }}\`
🌿 *Branch:* \`${{ github.ref_name }}\`
📝 *Commit:* \`${SHORT_SHA}\` — ${COMMIT_MSG}
👤 *Author:* ${AUTHOR}
🧪 *Tests:* ${TEST_STATUS}
🚀 *Deploy:* ${DEPLOY_STATUS}
🔗 *URL:* http://${{ secrets.GCP_VM_HOST }}"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{
              \"chat_id\": \"${TELEGRAM_CHAT_ID}\",
              \"text\": \"${MESSAGE}\",
              \"parse_mode\": \"Markdown\"
            }"
